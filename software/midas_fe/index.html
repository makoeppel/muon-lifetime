<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Live MIDAS Waveforms</title>

  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
    }

    .topbar {
      padding: 10px;
      display: flex;
      gap: 20px;
      align-items: center;
      border-bottom: 1px solid #ccc;
      flex-wrap: wrap;
    }

    input[type=number] {
      width: 90px;
    }

    button {
      padding: 4px 10px;
      cursor: pointer;
    }

    #plotWave {
      width: 100vw;
      height: calc(100vh - 70px);
    }

    .small {
      font-size: 12px;
      color: #555;
    }
  </style>
</head>

<body>

<div class="topbar">
  <div>
    Up thr:
    <input id="thr_up" type="number" step="1" value="-80">

    Down thr:
    <input id="thr_down" type="number" step="1" value="-80">

    Block thr:
    <input id="thr_block" type="number" step="1" value="-80">

    <button id="apply">Apply</button>
  </div>

  <div class="small">
    Serial: <span id="ser">-</span> |
    Last update: <span id="ts">-</span> |
    WS: <span id="wsstat">-</span>
  </div>
</div>

<div id="plotWave"></div>

<script>
/* ===========================
   WebSocket
=========================== */

const ws = new WebSocket(`ws://${location.host}/ws`);
const wsStat = document.getElementById("wsstat");

ws.onopen = () => wsStat.textContent = "connected";
ws.onclose = () => wsStat.textContent = "closed";
ws.onerror = () => wsStat.textContent = "error";

/* ===========================
   UI
=========================== */

const thrUp    = document.getElementById("thr_up");
const thrDown  = document.getElementById("thr_down");
const thrBlock = document.getElementById("thr_block");

const serSpan = document.getElementById("ser");
const tsSpan  = document.getElementById("ts");

/* ===========================
   Local state
=========================== */

let latest = null;
let paramsInitialized = false;

/* ===========================
   Send thresholds
=========================== */

function sendParams() {
  const thr = {
    up:    parseFloat(thrUp.value),
    down:  parseFloat(thrDown.value),
    block: parseFloat(thrBlock.value),
  };

  for (const ch of ["up", "down", "block"]) {
    ws.send(JSON.stringify({
      type: "set_params",
      channel: ch,
      threshold: thr[ch],
      min_sep_ns: 0
    }));
  }

  /* optimistic update (prevents snapping back) */
  if (latest && latest.thresholds) {
    latest.thresholds = { ...thr };
  }

  renderWaveforms();
}

document.getElementById("apply").addEventListener("click", sendParams);

/* ===========================
   Plot rendering
=========================== */

function renderWaveforms() {
  if (!latest) return;
  if (!latest.t_ns || latest.t_ns.length === 0) return;

  const t = latest.t_ns;
  const up = latest.up || [];
  const down = latest.down || [];
  const block = latest.block || [];

  const thr = latest.thresholds || { up: -80, down: -80, block: -80 };
  const edges = latest.edges || { up: [], down: [], block: [] };

  const traces = [
    { x: t, y: up,    mode: "lines", name: "up" },
    { x: t, y: down,  mode: "lines", name: "down" },
    { x: t, y: block, mode: "lines", name: "block" },

    { x: edges.up,    y: edges.up.map(() => thr.up),    mode: "markers", name: "up edges" },
    { x: edges.down,  y: edges.down.map(() => thr.down),mode: "markers", name: "down edges" },
    { x: edges.block, y: edges.block.map(() => thr.block),mode: "markers", name: "block edges" },
  ];

  const shapes = [
    { type: "line", x0: t[0], x1: t[t.length-1], y0: thr.up,    y1: thr.up,    line: { dash: "dot" } },
    { type: "line", x0: t[0], x1: t[t.length-1], y0: thr.down,  y1: thr.down,  line: { dash: "dot" } },
    { type: "line", x0: t[0], x1: t[t.length-1], y0: thr.block, y1: thr.block, line: { dash: "dot" } },
  ];

  Plotly.react("plotWave", traces, {
    margin: { t: 20, l: 60, r: 20, b: 50 },
    xaxis: { title: "time (ns)" },
    yaxis: {
      title: "mV",
      range: [-520, 20],
      autorange: false
    },
    shapes: shapes,
    legend: { orientation: "h" }
  });
}

/* ===========================
   Receive updates
=========================== */

ws.onmessage = (ev) => {
  latest = JSON.parse(ev.data);

  serSpan.textContent = latest.last_event_serial ?? "-";

  if (latest.last_update_unix) {
    tsSpan.textContent = new Date(
      latest.last_update_unix * 1000
    ).toLocaleTimeString();
  }

  /* Initialize inputs ONCE */
  if (!paramsInitialized && latest.thresholds) {
    thrUp.value    = latest.thresholds.up;
    thrDown.value  = latest.thresholds.down;
    thrBlock.value = latest.thresholds.block;
    paramsInitialized = true;
  }

  renderWaveforms();
};
</script>

</body>
</html>
